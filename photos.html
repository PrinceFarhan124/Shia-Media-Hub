<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Islamic Photos</title><style>
body{
background:#111;
color:white;
font-family:Arial,sans-serif;
margin:0;
text-align:center;
}

h1{
padding:20px;
}

.gallery{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
padding:15px;
}

.gallery img{
width:100%;
height:220px;
object-fit:cover;
border-radius:12px;
box-shadow:0 4px 10px rgba(0,0,0,0.5);
cursor:pointer;
transition:0.3s;
}

.gallery img:hover{
transform:scale(1.03);
}

.lightbox{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.95);
justify-content:center;
align-items:center;
z-index:999;
}

.lightbox img{
max-width:95%;
max-height:95%;
border-radius:10px;
}
</style></head><body><h1>🖼️ Islamic Photos</h1><div class="gallery"><img src="1.jpg" onclick="openImage(this.src)">
<img src="uploaded-images/1.jpg" onclick="openImage(this.src)">
<img src="uploaded-images/2.jpg" onclick="openImage(this.src)">
<img src="uploaded-images/3.jpg" onclick="openImage(this.src)">
<img src="uploaded-images/4.jpg" onclick="openImage(this.src)">
<img src="uploaded-images/5.jpg" onclick="openImage(this.src)">
<img src="uploaded-images/6.jpg" onclick="openImage(this.src)">
<img src="uploaded-images/7.jpg" onclick="openImage(this.src)">
<img src="uploaded-images/8.jpg" onclick="openImage(this.src)">
<img src="uploaded-images/9.jpg" onclick="openImage(this.src)">
<img src="uploaded-images/10.jpg" onclick="openImage(this.src)"></div><div class="lightbox" id="lightbox" onclick="closeImage()">
<img id="fullImage">
</div><script>
function openImage(src){
document.getElementById("fullImage").src = src;
document.getElementById("lightbox").style.display = "flex";
}

function closeImage(){
document.getElementById("lightbox").style.display = "none";
}
</script></body>
</html>
