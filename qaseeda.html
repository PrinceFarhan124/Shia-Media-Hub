<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Qaseeda Videos</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    /* Grid layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 15px;
    }

    /* Video card */
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: 0.2s ease;
    }

    .card:hover {
      transform: scale(1.03);
    }

    /* Video */
    iframe {
      width: 100%;
      height: 220px;
      border-radius: 10px;
      border: none;
    }

    /* Back button */
    .back {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 15px;
      background: #333;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    .back:hover {
      background: #000;
    }
  </style>
</head>

<body>

  <a class="back" href="index.html">⬅ Back</a>

  <h1>📚 Qaseeda Collection</h1>

  <div class="grid">

    <div class="card">
      <iframe src="https://www.youtube.com/embed/uJRzBDnYDD4" allowfullscreen></iframe>
    </div>

    <div class="card">
      <iframe src="https://www.youtube.com/embed/n0TGFJmtvno" allowfullscreen></iframe>
    </div>

    <div class="card">
      <iframe src="https://www.youtube.com/embed/B3K2rYU576c" allowfullscreen></iframe>
    </div>
<div class="card">
      <iframe src="https://www.youtube.com/embed/10_5y9irj9E" allowfullscreen></iframe>
    </div>
  </div>

</body>
</html>
