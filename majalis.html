<title>Majalis Videos</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0f0f0f;
    color:white;
}

h1{
    text-align:center;
    padding:20px;
    margin:0;
}

/* GRID */
.video-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:15px;
    padding:15px;
}

/* mobile responsive */
@media(max-width:768px){
    .video-grid{
        grid-template-columns:1fr;
    }
}

/* video box */
.video{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border-radius:10px;
    overflow:hidden;
}

.video iframe{
    width:100%;
    height:100%;
    border:0;
}
</style>

</head>
